name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate frontend and repository metadata
        run: |
          npm run versions:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run docs:check
          npm run json:check
          npm run tauri:check
          npm run workflows:check

      - name: Audit npm dependency graph
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

  python:
    name: Python
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Install isolated locked Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --no-deps --requirement requirements-ci.lock
          .\.venv\Scripts\python.exe -m pip check

      - name: Validate Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe -m ruff format --check .
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m pytest

  rust:
    name: Rust
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned Python for the authentic sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Build authentic local-core sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --no-deps --requirement requirements-ci.lock
          .\scripts\build-sidecar.ps1

      - name: Resolve repository-pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Validate Rust and Tauri shell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
