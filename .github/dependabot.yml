version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      python-development:
        patterns:
          - hatchling
          - httpx
          - pyinstaller
          - pytest*
          - ruff
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
